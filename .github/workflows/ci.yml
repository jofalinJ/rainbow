name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Unit / Static / Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run security

  integration:
    name: Supabase integration (isolated environment)
    if: vars.RAINBOW_TEST_ENV_READY == 'true'
    runs-on: ubuntu-latest
    environment: test
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Verify isolated test environment
        run: |
          test -n "$SUPABASE_TEST_URL"
          test -n "$SUPABASE_TEST_SERVICE_ROLE_KEY"
          case "$SUPABASE_TEST_URL" in
            *ajnicsvtymvvkgepjmmk.supabase.co*) echo "Production Supabase URL is not allowed."; exit 1 ;;
          esac
      - run: npm run test:integration

  authenticated-e2e:
    name: Authenticated Selenium E2E (isolated environment)
    if: vars.RAINBOW_E2E_READY == 'true'
    runs-on: ubuntu-latest
    environment: test
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      E2E_ENABLED: "true"
      E2E_ISOLATED_ENV: "true"
      E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      BILL_E2E_TOKEN: ${{ secrets.BILL_E2E_TOKEN }}
      E2E_BASE_URL: "http://127.0.0.1:4173"
      PORT: "4173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Verify isolated E2E environment
        run: |
          test -n "$SUPABASE_TEST_URL"
          test -n "$SUPABASE_TEST_PUBLISHABLE_KEY"
          test -n "$E2E_ADMIN_USERNAME"
          test -n "$E2E_ADMIN_PASSWORD"
          case "$SUPABASE_TEST_URL" in
            *ajnicsvtymvvkgepjmmk.supabase.co*) echo "Production Supabase URL is not allowed."; exit 1 ;;
          esac
      - run: node scripts/write-test-config.mjs
      - run: nohup node scripts/static-server.mjs > test-server.log 2>&1 & echo $! > server.pid; sleep 2; curl --fail http://127.0.0.1:4173/admin/login.html
      - run: npm run test:e2e:authenticated
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-authenticated-failure-artifacts
          path: |
            test-results/selenium
            test-server.log

  stock-audit-sql:
    name: Stock audit migration / PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: rainbow_ci
          POSTGRES_PASSWORD: rainbow_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rainbow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Execute stock journal SQL against disposable database
        env:
          PGPASSWORD: rainbow_ci_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d rainbow_ci -v ON_ERROR_STOP=1 -f tests/sql/stock_change_journal.sql
      - name: Exercise online order source-ledger migration in separate disposable DB
        env:
          PGPASSWORD: rainbow_ci_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE rainbow_online_ci'
          psql -h 127.0.0.1 -p 5432 -U postgres -d rainbow_online_ci -v ON_ERROR_STOP=1 -f tests/sql/online_order_source_ledger.sql

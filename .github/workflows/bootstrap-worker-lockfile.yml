name: Bootstrap Cloudflare Worker npm lockfile

on:
  push:
    branches:
      - fix/cloudflare-worker-lockfile-20261024
    paths:
      - .github/workflows/bootstrap-worker-lockfile.yml

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: github.repository == 'jofalinJ/rainbow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate npm lockfile for Cloudflare Worker
        working-directory: backend/rainbow-api
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify Cloudflare clean installation
        working-directory: backend/rainbow-api
        run: npm ci --no-audit --no-fund
      - name: Validate Worker and test existing payment logic
        working-directory: backend/rainbow-api
        run: npm run check && npm test
      - name: Commit the verified lockfile to the fix branch
        run: |
          test -s backend/rainbow-api/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/rainbow-api/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "fix(worker): include lockfile required by Cloudflare npm ci"
            git push origin HEAD:fix/cloudflare-worker-lockfile-20261024
          fi

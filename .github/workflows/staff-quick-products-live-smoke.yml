name: Live Quick Products release verification
# Release 2026-11-10: check the actual cache-busted staff script and refreshed pages.

on:
  push:
    branches: [main]
    paths:
      - 'admin/owner.html'
      - 'admin/owner.js'
      - 'admin/owner.css'
      - 'admin/app.js'
      - 'admin/*.html'
      - '.github/workflows/staff-quick-products-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Confirm live staff quick catalogue (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify Cloudflare serves the released staff assets
        shell: bash
        run: |
          set -euo pipefail
          site="https://rainbowgoldcovering.com"
          for attempt in $(seq 1 28); do
            echo "Checking deployed staff assets: attempt ${attempt}/28"
            if html=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/owner.html?release=${GITHUB_SHA}") &&
               script=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/owner.js?release=${GITHUB_SHA}") &&
               styling=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/owner.css?release=${GITHUB_SHA}") &&
               nav=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/app.js?v=20261111-sidebar-ready") &&
               products=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/products.html?release=${GITHUB_SHA}") &&
               billing=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/billing.html?release=${GITHUB_SHA}") &&
               offline=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/offline-pos.html?release=${GITHUB_SHA}") &&
               offlinecore=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/offline-pos-core.mjs?release=${GITHUB_SHA}") &&
               offlinesync=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/offline-pos-sync.mjs?release=${GITHUB_SHA}") &&
               worker=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/service-worker.js?release=${GITHUB_SHA}") &&
               postcode=$(curl -L --fail --silent --show-error --max-time 12 "${site}/pin-lookup.mjs?release=${GITHUB_SHA}") &&
               scanner=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/billing-scanner.js?release=${GITHUB_SHA}") &&
               printer=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/printer-test.html?release=${GITHUB_SHA}") &&
               login=$(curl -L --fail --silent --show-error --max-time 12 "${site}/admin/login.html?release=${GITHUB_SHA}"); then
              if grep -Fq 'id="roleAccessNote"' <<< "$html" &&
                 grep -Fq '<aside aria-label="Admin sidebar"></aside>' <<< "$html" &&
                 grep -Fq 'data-screen="categories" class="active"' <<< "$html" &&
                 grep -Fq 'const markupPrice=amount=>Math.floor(' <<< "$script" &&
                 grep -Fq 'id="publishNow"' <<< "$html" &&
                 grep -Fq 'id="ownerStockConfirm"' <<< "$html" &&
                 grep -Fq 'id="ownerMoreDetails"' <<< "$html" &&
                 grep -Fq 'id="categoryCatalogueList"' <<< "$html" &&
                 grep -Fq 'id="onlineVisibilityDialog"' <<< "$html" &&
                 grep -Fq 'owner.js?v=20261111-smooth-transition' <<< "$html" &&
                 grep -Fq 'owner.css?v=20261111-smooth-transition' <<< "$html" &&
                 grep -Fq 'app.js?v=20261111-sidebar-ready' <<< "$html" &&
                 grep -Fq 'startup-spinner' <<< "$html" &&
                 grep -Fq 'const sidebarReady=window.rainbowSidebarReady' <<< "$script" &&
                 grep -Fq 'return profile;' <<< "$nav" &&
                 grep -Fq 'window.rainbowSidebarReady=bootAdminPage()' <<< "$nav" &&
                 grep -Fq 'position:fixed;inset:0;z-index:500' <<< "$styling" &&
                 grep -Fq 'id="onlineVisibilityAvailable"' <<< "$html" &&
                 grep -Fq 'id="onlineVisibilityCurrent"' <<< "$html" &&
                 grep -Fq 'addStock.textContent="＋ Add Online Stock"' <<< "$script" &&
                 grep -Fq 'const markupPrice=amount=>Math.floor(' <<< "$script" &&
                 grep -Fq ' · Online "+onlineMoney(onlinePriceOf(p))' <<< "$script" &&
                 grep -Fq 'async function loadOnlineStockAvailability()' <<< "$script" &&
                 grep -Fq 'function renderCategoryCatalogue()' <<< "$script" &&
                 grep -Fq 'button.textContent=online?"Hide Online":"Show Online"' <<< "$script" &&
                 grep -Fq 'Just three fields' <<< "$html" &&
                 grep -Fq 'Save product for approval' <<< "$html" &&
                 ! grep -Fiq 'salesforce' <<< "$html" &&
                 grep -Fq 'show(["categories","products","editor","dashboard"].includes(requested)?requested:"categories")' <<< "$script" &&
                 grep -Fq '#startup[hidden]{display:none!important}' <<< "$styling" &&
                 grep -Fq 'const canPublish=()=>state.role==="admin"' <<< "$script" &&
                 grep -Fq 'applyRoleUI();' <<< "$script" &&
                 grep -Fq 'Online Products' <<< "$nav" &&
                 grep -Fq 'app.js?v=20261111-online-products' <<< "$products" &&
                 grep -Fq 'app.js?v=20261111-online-products' <<< "$billing" &&
                 grep -Fq 'id="startScanner"' <<< "$billing" &&
                 grep -Fq 'id="prepareOffline"' <<< "$billing" &&
                 grep -Fq 'offline-pos-bridge.mjs?v=20261111' <<< "$billing" &&
                 grep -Fq 'id="unlockForm"' <<< "$offline" &&
                 grep -Fq 'id="cashCollected"' <<< "$offline" &&
                 grep -Fq 'name:"AES-GCM"' <<< "$offlinecore" &&
                 grep -Fq 'p_request:sale.id' <<< "$offlinesync" &&
                 grep -Fq 'rainbow-staff-offline-pos-v2' <<< "$worker" &&
                 grep -Fq 'cache.addAll(FILES)' <<< "$worker" &&
                 grep -Fq 'id="billingPinLookupStatus"' <<< "$billing" &&
                 grep -Fq 'billing-pin.mjs?v=20261111' <<< "$billing" &&
                 grep -Fq 'parseIndianPinResponse' <<< "$postcode" &&
                 grep -Fq 'billing-scanner.js?v=20261111' <<< "$billing" &&
                 grep -Fq 'BrowserMultiFormatReader' <<< "$scanner" &&
                 grep -Fq 'id="printTest"' <<< "$printer" &&
                 grep -Fq 'Staff / Admin Login' <<< "$login"; then
                echo "Live Cloudflare staff catalogue assets verified. No sign-in, stock, or payment mutation was attempted."
                exit 0
              fi
              echo "Cloudflare has not served the new Quick Products release yet."
            fi
            if [ "$attempt" -lt 28 ]; then sleep 12; fi
          done
          echo "::error::Live staff assets are stale or incomplete. Check Cloudflare Pages deployment and branch settings."
          exit 1

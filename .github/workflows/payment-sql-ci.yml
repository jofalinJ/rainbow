name: Payment SQL in disposable PostgreSQL

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261021*'
      - 'supabase/migrations/20261024*'
      - 'supabase/migrations/20261103*'
      - 'tests/sql/**'
      - '.github/workflows/payment-sql-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rainbow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rainbow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rainbow_test
    steps:
      - uses: actions/checkout@v4
      - name: Confirm PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Load disposable payment schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/payment-fixture.sql
      - name: Install proposed TEST-mode gateway migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021194000_razorpay_test_reservation_checkout.sql
      - name: Install proposed manual UPI safety migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021202500_manual_upi_guest_idempotency.sql
      - name: Install paid finalization and deployed refund hardening
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021234000_finalize_paid_orders_invoice_whatsapp.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024142005_harden_checkout_settlement_refunds.sql
      - name: Verify retry, inventory, expiry, privacy and captured payment rules
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/payment-behavior.sql
      - name: Verify settlement, refund evidence, role grants and privacy
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/payment-postsettlement.sql
      - name: Install interstate GST in disposable PostgreSQL only
        run: PGOPTIONS="-c check_function_bodies=off" psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103183000_interstate_igst_checkout.sql
      - name: Verify interstate tax and checkout idempotency
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/interstate-igst-behavior.sql

name: Public E2E

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Customer Selenium smoke tests
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment_status.target_url, 'https://jofalinj.github.io/rainbow'))
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.target_url || 'https://jofalinj.github.io/rainbow/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:e2e:public
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-public-failure-artifacts
          path: test-results/selenium

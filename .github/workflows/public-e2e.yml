name: Public E2E

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Customer Selenium smoke tests
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && (startsWith(github.event.deployment_status.environment_url, 'https://jofalinj.github.io/rainbow') || startsWith(github.event.deployment_status.target_url, 'https://jofalinj.github.io/rainbow')))
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || 'https://jofalinj.github.io/rainbow' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Confirm published storefront responds
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$E2E_BASE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages storefront did not respond successfully."
          exit 1
      - run: npm run test:e2e:public
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-public-failure-artifacts
          path: test-results/selenium

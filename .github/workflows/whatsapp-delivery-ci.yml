name: WhatsApp delivery status SQL in disposable PostgreSQL

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261121163000_whatsapp_delivery_tracking.sql'
      - 'tests/sql/whatsapp-delivery-*.sql'
      - '.github/workflows/whatsapp-delivery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-status:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d delivery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: delivery_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if missing
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Load isolated webhook fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-delivery-fixture.sql
      - name: Install proposed delivery status migration only in disposable DB
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261121163000_whatsapp_delivery_tracking.sql
      - name: Test authorization, duplicates, reordering, early callbacks
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-delivery-behavior.sql

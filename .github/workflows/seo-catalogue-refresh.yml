name: Cloudflare SEO catalogue scheduled refresh

on:
  pull_request:
    paths:
      - '.github/workflows/seo-catalogue-refresh.yml'
      - 'scripts/generate-seo-pages.mjs'
      - 'tests/seo/**'
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Always produce an inspectable SEO preview, even before release approval.
  # This fetches only published, public-RLS catalogue data and never deploys.
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate catalogue SEO preview locally (read-only Supabase)
        run: node scripts/generate-seo-pages.mjs
      - name: Validate generated SEO URLs and escaping
        run: node --test tests/seo/seo-pages.test.mjs
      - name: Upload preview, not production files
        uses: actions/upload-artifact@v4
        with:
          name: seo-catalogue-preview
          path: |
            sitemap.xml
            scripts/seo-manifest.json
            categories/
            products/
          retention-days: 7
          if-no-files-found: error

  trigger-approved-deploy:
    if: github.event_name != 'pull_request' && vars.RAINBOW_SEO_CATALOGUE_APPROVED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Request Cloudflare Pages rebuild with current online catalogue
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Set CLOUDFLARE_PAGES_DEPLOY_HOOK_URL to a Cloudflare Pages deploy hook."
            exit 1
          fi
          case "$DEPLOY_HOOK" in
            https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/*) ;;
            *) echo "::error::Invalid Cloudflare Pages deploy hook"; exit 1 ;;
          esac
          curl --fail --show-error --silent --retry 2 -X POST "$DEPLOY_HOOK"

name: Razorpay live readiness smoke

on:
  pull_request:
    paths:
      - 'order-razorpay.mjs'
      - 'order.js'
      - 'order.html'
      - 'backend/rainbow-api/src/routes/razorpay.js'
      - '.github/workflows/razorpay-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - name: Probe public Razorpay API (read-only; never charge)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://rainbow-api.jofalin2005.workers.dev/api/razorpay';
          const headers={Origin:'https://rainbowgoldcovering.com',Accept:'application/json'};
          const res=await fetch(base+'/config?ci='+Date.now(),{headers,cache:'no-store'});
          if(!res.ok)throw new Error('Gateway config HTTP '+res.status);
          const body=await res.json();
          if(!['test','live'].includes(body.mode)||typeof body.enabled!=='boolean')
            throw new Error('Unexpected public gateway config');
          if(body.enabled && !new RegExp('^rzp_'+body.mode+'_[A-Za-z0-9]+$').test(body.keyId||''))
            throw new Error('Enabled gateway has no valid public Key ID');
          if('keySecret' in body || 'RAZORPAY_LIVE_KEY_SECRET' in body)
            throw new Error('Secret field exposed in public gateway config');
          console.log(JSON.stringify({mode:body.mode,enabled:body.enabled,release:body.release,
            validPublicKey:body.enabled?true:null}));
          const probe=await fetch(base+'/provider-check?ci='+Date.now(),{headers,cache:'no-store'});
          const state=await probe.json().catch(()=>({}));
          console.log(JSON.stringify({providerCheckHttp:probe.status,provider:state.provider||'not-available'}));
          NODE
      - name: Verify deployed storefront payment assets (read-only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for(const path of ['/order.html','/payment-config.js','/order-razorpay.mjs','/order.js']){
            const res=await fetch('https://rainbowgoldcovering.com'+path,{cache:'no-store'});
            const body=await res.text();
            console.log(JSON.stringify({asset:path,http:res.status,bytes:body.length}));
            if(!res.ok||!body.trim())throw new Error('Missing checkout asset '+path);
          }
          NODE

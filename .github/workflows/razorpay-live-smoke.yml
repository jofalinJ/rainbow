name: Razorpay live readiness smoke

on:
  pull_request:
    paths:
      - 'order-razorpay.mjs'
      - 'order.js'
      - 'order.html'
      - 'backend/rainbow-api/src/routes/razorpay.js'
      - 'tests/unit/paymentAvailability.test.mjs'
      - '.github/workflows/razorpay-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps
      - name: Verify real browser payment selection
        run: node --test tests/e2e/selenium/tests/payment-readiness.test.mjs
      - name: Probe payment API with storefront Origin
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://rainbow-api.jofalin2005.workers.dev/api/razorpay/config';
          for(let i=0;i<4;i++){
            const url=i%2?base+'?check='+Date.now()+'-'+i:base;
            const origin=i<2?'https://rainbowgoldcovering.com':null;
            const headers=origin?{Origin:origin,Accept:'application/json'}:{Accept:'application/json'};
            const res=await fetch(url,{headers,cache:'no-store'});
            const body=await res.json().catch(()=>({}));
            console.log(JSON.stringify({probe:i,withOrigin:Boolean(origin),http:res.status,
              enabled:body.enabled,mode:body.mode,release:body.release??'old-build',
              keyFormat:/^rzp_test_[A-Za-z0-9]+$/.test(body.keyId||''),
              allowedOrigin:res.headers.get('access-control-allow-origin'),
              cache:res.headers.get('cache-control'),cfRayPrefix:(res.headers.get('cf-ray')||'').split('-').pop()}));
            await new Promise(resolve=>setTimeout(resolve,600));
          }
          NODE
      - name: Diagnose live TEST Razorpay API credentials without exposing keys
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://rainbow-api.jofalin2005.workers.dev/api/razorpay/provider-check',{
            method:'GET',cache:'no-store',
            headers:{Origin:'https://rainbowgoldcovering.com',Accept:'application/json'}
          });
          const json=await res.json().catch(()=>({}));
          console.log(JSON.stringify({check:'razorpay-provider',http:res.status,provider:json.provider||'not-deployed',
            allowedOrigin:res.headers.get('access-control-allow-origin')}));
          NODE
      - name: Verify deployed checkout assets exist
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for(const path of ['/order.html','/payment-config.js','/order-razorpay.mjs','/order.js']){
            const res=await fetch('https://rainbowgoldcovering.com'+path,{cache:'no-store'});
            const body=await res.text();
            console.log(JSON.stringify({asset:path,http:res.status,bytes:body.length,
              hasGateway:body.includes('razorpayTestAvailability')||body.includes('rainbow-api.jofalin2005.workers.dev')}));
          }
          NODE

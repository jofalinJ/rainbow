services:
  face-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FACE_DATA_DIR: /data
      FACE_MODEL_DIR: /app/models
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - face-vectors:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; r=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'));sys.exit(0 if r['models_ready'] else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  face-vectors:

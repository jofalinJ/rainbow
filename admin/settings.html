<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f1520"><link rel="icon" type="image/png" href="../assets/brand/rainbow-logo.png">
<title>Business Settings — Rainbow Gold Covering</title><link rel="stylesheet" href="style.css"><script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="app.js?v=20261012-sidebar"></script><script defer src="settings.js?v=20261008"></script></head>
<body><aside aria-label="Admin sidebar"></aside>
<main><header><div><p class="eyebrow">CONFIGURATION</p><h1>Business Settings</h1></div><button class="profile" onclick="logout()">Sign out</button></header>
<div id="pageError" class="panel" style="display:none"></div>
<section class="panel" style="margin-bottom:18px"><div class="panelhead"><h2>Brand & business information</h2></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<label>Business name<input id="business_name" type="text"></label><label>Legal display name<input id="legal_display_name" type="text"></label>
<label>Tagline<input id="tagline" type="text"></label><label>Trust line<input id="trust_line" type="text"></label>
<label>Instagram handle<input id="instagram_handle" type="text"></label><label>Logo URL<input id="logo_url" type="url"></label></div>
<button id="saveBusiness" class="profile" style="margin-top:18px">Save business settings</button><span id="businessStatus" style="margin-left:12px"></span></section>
<section class="panel"><div class="panelhead"><h2>Store branches</h2><button id="newBranch">＋ Add Branch</button></div><div id="branchRows"></div></section>
</main></body></html>

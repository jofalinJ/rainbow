<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainbow — Offline Drafts</title><script defer src="offline-drafts.js"></script></head><body><main style="max-width:720px;margin:25px auto;font:16px system-ui"><a href="billing.html">Online Billing</a><h1>Offline Drafts</h1><p style="border:1px solid #b98555;padding:16px"><b>NOT AN INVOICE OR A SALE.</b> Save product notes only. No payments or completed sales offline. Recheck stock, price and tax when back online. Do not enter customer personal information.</p><form id="draftForm"><label>Product code <input id="sku" required maxlength="60"></label><label>Quantity <input id="qty" required type="number" min="1" max="1000" value="1"></label><button type="submit">Save device draft</button></form><p id="status" role="status"></p><h2>Stored drafts</h2><div id="drafts"></div><button id="deleteAll" type="button">Delete all drafts after reconciliation</button></main><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('offline-sw.js',{scope:'./'}).catch(()=>{});</script></body></html>

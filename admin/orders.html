<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f1520"><link rel="icon" type="image/png" href="../assets/brand/rainbow-logo.png"><title>Rainbow Gold Covering — Orders</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="orders.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><aside aria-label="Admin sidebar"></aside>
<main><header><div><p class="eyebrow">ONLINE SALES</p><h1>Orders</h1></div><button class="profile" id="refresh">Refresh</button></header>
<section class="panel"><div class="panelhead"><div><h2>Customer orders</h2><span class="muted">Delivery address, order status and WhatsApp alerts.</span></div></div>
<div class="filters"><input id="search" placeholder="Search order, customer or WhatsApp"><select id="status"><option value="all">All statuses</option><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option><option>refunded</option></select></div>
<div class="table-wrap"><table class="orders-table"><thead><tr><th>Order</th><th>Customer</th><th>Delivery</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div><p id="msg" class="form-msg"></p></section></main>
<section id="modal" class="modal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><div><p class="eyebrow">ORDER DETAILS</p><h2 id="mTitle">Order</h2></div><button id="close">Close</button></div><div id="mBody"></div></div></section>
<script src="app.js?v=20261011-staff-attendance"></script><script src="orders.js?v=20261011-orders-global-client-fix"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJ Gold Covering — Staff</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="app.js?v=20261005"></script></head><body><aside><div class="brand">JJ <span>GOLD COVERING</span></div><nav><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="#" onclick="return comingSoon('Orders')">Orders</a><a href="#" onclick="return comingSoon('Billing')">Billing</a><a href="#" onclick="return comingSoon('Customers')">Customers</a><a href="#" onclick="return comingSoon('Reports')">Reports</a><a class="active" href="staff.html">Staff</a><a href="#" onclick="return comingSoon('Settings')">Settings</a></nav><div class="user">Admin<br><small>Full access</small><button onclick="logout()" style="margin-top:12px">Sign out</button></div></aside><main><header><div><p class="eyebrow">TEAM</p><h1>Staff</h1></div><button class="profile" onclick="logout()">Sign out</button></header><section class="panel staff-add"><div class="panelhead"><div><h2>Add Staff</h2><p class="muted">Create a staff login with a name, username and password.</p></div></div><form id="staffForm" class="staff-form"><label>Full Name<input id="name" required placeholder="Staff name"></label><label>Username<input id="username" required pattern="[A-Za-z0-9._-]{3,30}" placeholder="e.g. arun"></label><label>Password<input id="password" type="password" minlength="6" required placeholder="Minimum 6 characters"></label><label>Role<select id="role" required><option value="cashier">Cashier</option><option value="inventory_staff">Inventory Staff</option></select></label><button class="primary" type="submit">＋ Create Staff</button></form><p id="formMsg" class="form-msg"></p></section><section class="panel"><div class="panelhead"><h2>Staff List</h2><button onclick="loadStaff()">Refresh</button></div><div class="table-wrap"><table class="staff-table"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="staffRows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><script src="staff.js?v=20261008"></script></body></html>

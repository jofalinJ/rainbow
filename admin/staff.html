<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f1520"><link rel="icon" type="image/png" href="../assets/brand/rainbow-logo.png"><title>Rainbow Gold Covering — Staff</title><link rel="stylesheet" href="style.css?v=20261011-staff-photos"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><aside aria-label="Admin sidebar"></aside><main><header><div><p class="eyebrow">TEAM</p><h1>Staff</h1></div><button class="profile" onclick="logout()">Sign out</button></header><section class="panel staff-add"><div class="panelhead"><div><h2>Add Staff</h2><p class="muted">Create a staff login with a name, username and password. Deletion permanently removes the account.</p></div></div><form id="staffForm" class="staff-form"><label>Full Name<input id="name" data-testid="staff-name" required placeholder="Staff name"></label><label>Username<input id="username" data-testid="staff-username" required pattern="[A-Za-z0-9._-]{3,30}" placeholder="e.g. arun"></label><label>Password<input id="password" data-testid="staff-password" type="password" minlength="6" required placeholder="Minimum 6 characters"></label><label>Role<select id="role" data-testid="staff-role" required><option value="cashier">Cashier</option><option value="inventory_staff">Inventory Staff</option></select></label><label class="staff-photo-field">Staff profile photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="user" required><small>Take or upload a clear photo for private admin review.</small></label><button class="primary" data-testid="create-staff" type="submit">＋ Create Staff</button></form><p id="formMsg" class="form-msg"></p></section><section class="panel"><div class="panelhead"><h2>Staff List</h2><button data-testid="refresh-staff" type="button" onclick="loadStaff()">Refresh</button></div><div class="table-wrap"><table class="staff-table"><thead><tr><th>Name</th><th>Username</th><th>Photo</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="staffRows" data-testid="staff-list"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><script src="app.js?v=20261015-admin-attendance-nav-v2"></script><script src="staff.js?v=20261011-staff-photos"></script></body></html>

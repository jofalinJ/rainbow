<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJ Gold Covering — Products</title><link rel="stylesheet" href="style.css">
<style>
.entry-grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;align-items:end}
.entry-grid .wide{grid-column:span 2}.entry-grid .full{grid-column:1/-1}
.field{min-width:0}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box}
.optional{display:none}.photo-wrap{display:flex;gap:10px;align-items:center}.photo-preview{width:54px;height:54px;border-radius:10px;overflow:hidden;background:#f3f3f3}.photo-preview img{width:100%;height:100%;object-fit:cover}
@media(max-width:1100px){.entry-grid{grid-template-columns:repeat(3,minmax(140px,1fr))}}
@media(max-width:650px){.entry-grid{grid-template-columns:1fr 1fr}.entry-grid .wide{grid-column:span 2}}
</style></head>
<body>
<aside><div class="brand">JJ <span>GOLD COVERING</span></div><nav><a href="index.html">Dashboard</a><a class="active" href="products.html">Products</a><a href="#" onclick="return comingSoon('Inventory')">Inventory</a><a href="#" onclick="return comingSoon('Orders')">Orders</a><a href="#" onclick="return comingSoon('Billing')">Billing</a><a href="#" onclick="return comingSoon('Customers')">Customers</a><a href="#" onclick="return comingSoon('Reports')">Reports</a><a href="#" onclick="return comingSoon('Staff')">Staff</a><a href="#" onclick="return comingSoon('Settings')">Settings</a></nav><div class="user">Admin<br><small>Product management</small><button onclick="logout()" style="margin-top:12px">Sign out</button></div></aside>
<main><header><div><p class="eyebrow">CATALOG</p><h1>Products</h1></div><button onclick="location.href='index.html'">Dashboard</button></header>
<section class="panel"><div class="panelhead"><h2>Add Product</h2><span>Only fields required for the selected category are shown</span></div>
<form id="form"><div class="entry-grid">
<div class="field"><label>Category<select id="category" required></select></label></div>
<div class="field wide"><label>Product Name<input id="name" required></label></div>
<div class="field"><label>Type<select id="type" required></select></label></div>
<div class="field"><label>Selling Price ₹<input id="price" type="number" min="0" step=".01" required></label></div>
<div class="field optional" id="sizeField"><label>Size<input id="size" value="0" placeholder="0 = No Size"></label></div>
<div class="field optional" id="colorField"><label>Color<input id="color" value="0" placeholder="0 = No Color"></label></div>
<div class="field"><label>Stock<input id="stock" type="number" min="0" value="0"></label></div>
<div class="field"><label>Low Stock Limit<input id="low" type="number" min="0" value="3"></label></div>
<div class="field wide"><label>Product Photo<input id="imageFile" type="file" accept="image/*" capture="environment"></label></div>
<div class="field optional" id="lengthField"><label>Length cm<input id="length" type="number" min="0" step=".1"></label></div>
<div class="field optional" id="thicknessField"><label>Thickness<input id="thickness"></label></div>
<div class="field optional" id="goldField"><label>Gold Amount g<input id="gold" type="number" min="0" step=".01"></label></div>
<div class="field wide"><label>Description<input id="description"></label></div>
<div class="photo-preview" id="preview"></div>
<div class="field"><button type="submit">Save Product</button></div>
<div class="field wide"><p id="msg"></p></div>
</div></form></section>
<section class="panel"><div class="panelhead"><h2>Product Catalog</h2><input id="search" placeholder="Search name, code or type"></div><table><thead><tr><th>Code</th><th>Product</th><th>Category</th><th>Type</th><th>Price</th><th>Stock</th></tr></thead><tbody id="rows"></tbody></table></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="products.js"></script></body></html>

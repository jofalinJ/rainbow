<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJ Gold Covering — Login</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;background:#f5f5f7;display:grid;place-items:center;min-height:100vh;color:#111}.box{background:#fff;width:min(380px,calc(100% - 40px));padding:36px;border-radius:24px;box-shadow:0 20px 60px #0001}h1{margin:0 0 8px;font-size:28px}p{color:#777}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:12px;border:1px solid #ddd;font-size:15px}button{background:#111;color:#fff;border:0;cursor:pointer}#msg{font-size:13px}</style></head><body><div class="box"><h1>JJ GOLD COVERING</h1><p>Admin access</p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="msg"></p><small>First time? Use the setup link below.</small><button id="setup" type="button" style="background:#eee;color:#111">Create first admin</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=supabase.createClient("https://ajnicsvtymvvkgepjmmk.supabase.co","sb_publishable_8DVJ4VEsYhfq2RwbbElrGw_h-RsKoWj");login.onsubmit=async e=>{e.preventDefault();msg.textContent="Signing in…";const{error}=await c.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}const{data:profile}=await c.from("staff_profiles").select("user_id").eq("user_id",(await c.auth.getUser()).data.user.id).maybeSingle();if(!profile){const u=(await c.auth.getUser()).data.user;const{error:x}=await c.from("staff_profiles").insert({user_id:u.id,full_name:u.email.split("@")[0],role:"admin",active:true});if(x){msg.textContent="Login succeeded, but admin setup failed: "+x.message;return}}location.href="index.html"};setup.onclick=()=>{document.querySelector("form").outerHTML='<form id="signup"><input id="name" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (6+ characters)" minlength="6" required><button>Create admin</button></form>';signup.onsubmit=async e=>{e.preventDefault();msg.textContent="Creating…";const{data,error}=await c.auth.signUp({email:email.value,password:password.value,options:{emailRedirectTo:"https://jofalinj.github.io/rainbow/admin/login.html"}});if(error){msg.textContent=error.message;return}if(!data.user){msg.textContent="Check your email to confirm your account.";return}const{error:x}=await c.from("staff_profiles").insert({user_id:data.user.id,full_name:name.value,role:"admin",active:true});if(x){msg.textContent="Account created. Check your email if confirmation is required, then sign in.";return}msg.textContent="Admin created. Sign in.";setTimeout(()=>location.reload(),800)}};</script></body></html>

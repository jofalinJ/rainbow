<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJ Gold Covering — Login</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;background:#f5f5f7;display:grid;place-items:center;min-height:100vh;color:#111}.box{background:#fff;width:min(380px,calc(100% - 40px));padding:36px;border-radius:24px;box-shadow:0 20px 60px #0001}h1{margin:0 0 8px;font-size:28px}p{color:#777}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:12px;border:1px solid #ddd;font-size:15px}button{background:#111;color:#fff;border:0;cursor:pointer}#msg{font-size:13px}</style></head><body><div class="box"><h1>JJ GOLD COVERING</h1><p id="mode">Staff / Admin Login</p><form id="login"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="msg"></p><small>Admin creates all staff accounts from the Staff panel.</small></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=supabase.createClient("https://ajnicsvtymvvkgepjmmk.supabase.co","sb_publishable_8DVJ4VEsYhfq2RwbbElrGw_h-RsKoWj");const staffEmail=u=>u.trim().toLowerCase()+"@staff.rainbow.local";login.onsubmit=async e=>{e.preventDefault();msg.textContent="Signing in…";const loginId=username.value.trim();const loginEmail=loginId.includes("@")?loginId:staffEmail(loginId);const{error}=await c.auth.signInWithPassword({email:loginEmail,password:password.value});if(error){msg.textContent="Invalid username or password.";return}location.href="index.html"};</script></body></html>

<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainbow Gold Covering — Staff Login</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8f1520"><script defer src="pwa.js"></script><link rel="icon" type="image/png" href="../assets/brand/rainbow-logo.png"><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;background:#f5f5f7;display:grid;place-items:center;min-height:100vh;color:#111}.box{box-sizing:border-box;background:#fff;width:min(380px,calc(100% - 40px));padding:36px;border-radius:24px;box-shadow:0 20px 60px #0001;border-top:4px solid #8f1520}.brand-logo{display:block;width:68px;height:68px;object-fit:contain;margin:0 auto 18px}h1{margin:0 0 8px;font-size:24px;text-align:center}p{color:#777}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:12px;border:1px solid #ddd;font-size:15px}button{background:#8f1520;color:#fff;border:0;cursor:pointer}#msg{font-size:13px}</style></head><body><div class="box"><img class="brand-logo" src="../assets/brand/rainbow-logo.png" alt="Rainbow Gold Covering logo" width="68" height="68"><h1>RAINBOW GOLD COVERING</h1><p id="mode">Staff / Admin Login</p><form id="login"><input id="username" data-testid="login-username" placeholder="Username" required><input id="password" data-testid="login-password" type="password" placeholder="Password" required><button data-testid="login-submit">Sign in</button></form><p id="msg"></p><small>Admin creates all staff accounts from the Staff panel.</small></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const cfg=window.RAINBOW_SUPABASE_CONFIG;const form=document.getElementById("login"),msg=document.getElementById("msg"),username=document.getElementById("username"),password=document.getElementById("password");if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey){msg.textContent="Login configuration is unavailable.";throw new Error("Missing Supabase configuration.");}const c=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const staffEmail=u=>u.trim().toLowerCase()+"@staff.rainbow.local";form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Signing in…";const loginId=username.value.trim();const loginEmail=loginId.includes("@")?loginId:staffEmail(loginId);const{error}=await c.auth.signInWithPassword({email:loginEmail,password:password.value});if(error){msg.textContent="Invalid username or password.";return}location.href="index.html"});</script></body></html>

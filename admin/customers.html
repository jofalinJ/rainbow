<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f1520"><link rel="icon" type="image/png" href="../assets/brand/rainbow-logo.png"><title>Rainbow Gold Covering — Customers</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="customers.css?v=20261015-bill-history-v1"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>

<dialog id="customerDetails" class="customer-dialog" aria-labelledby="customerDetailsHeading">

  <div id="customerDetailsBody" aria-live="polite"></div>
</dialog>
